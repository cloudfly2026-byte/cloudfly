services:
  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      TZ: America/Bogota
      MYSQL_DATABASE: cloud_master
      MYSQL_PASSWORD: widowmaker
      MYSQL_ROOT_PASSWORD: widowmaker
    volumes:
      - persistent_master:/var/lib/mysql
    networks:
      - default
      - kafka-net
      - app-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:9092,PLAINTEXT_EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - kafka-net

  backend-api:
    image: cloudfly-backend-api:latest
    container_name: backend-api
    build:
      context: ./backend_new
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/uploads
    env_file:
      - .env
    environment:
      - TZ=America/Bogota
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=cloud_master
      - SPRING_R2DBC_URL=r2dbc:mysql://mysql:3306/cloud_master?serverZoneId=America/Bogota
      - DB_USERNAME=root
      - DB_PASSWORD=widowmaker
      - KAFKA_HOST=kafka
      - SPRING_PROFILES_ACTIVE=dev
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=CAMBIA_ESTA_LLAVE_LARGA_Y_UNICA
      - JWT_SECRET=${JWT_SECRET}
      - LEAD_GENERATOR_URL=http://lead-generator:8000
    networks:
      - app-net
      - kafka-net

  billing-service:
    image: cloudfly-billing-service:latest
    container_name: billing-service
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8086:8080"
    env_file:
      - .env
    environment:
      - TZ=America/Bogota
      - BACKEND_API_URL=http://backend-api:8080/internal/billing
      - WOMPI_PRIVATE_KEY=${WOMPI_PRIVATE_KEY}
      - WOMPI_PUBLIC_KEY=${WOMPI_PUBLIC_KEY}
      - WOMPI_EVENTS_SECRET=${WOMPI_EVENTS_SECRET}
      - WOMPI_BASE_URL=https://sandbox.wompi.co/v1
      - KAFKA_BROKER=kafka:9092
      - PORT=8080
    volumes:
      - ./uploads:/uploads
    networks:
      - app-net
      - kafka-net
    depends_on:
      - backend-api
      - kafka

  scheduler-service:
    image: cloudfly-scheduler-service:latest
    container_name: scheduler-service
    restart: always
    ports:
      - "8085:8080"
    build:
      context: ./scheduler_service
      dockerfile: Dockerfile
    volumes:
      - ./uploads:/uploads
    env_file:
      - .env
    environment:
      - TZ=America/Bogota
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=cloud_master
      - SPRING_R2DBC_URL=r2dbc:mysql://mysql:3306/cloud_master?serverZoneId=America/Bogota
      - DB_USERNAME=root
      - DB_PASSWORD=widowmaker
      - KAFKA_HOST=kafka
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - app-net
      - kafka-net
    depends_on:
      - db
      - kafka

  notification-service:
    build:
      context: ./notifications
      dockerfile: Dockerfile
    container_name: notification-service
    restart: always
    environment:
      - TZ=America/Bogota
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=cloud_master
      - DB_USERNAME=root
      - DB_PASSWORD=widowmaker
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - SOCKET_SERVICE_URL=http://chat_socket:3001
      - N8N_SECRET_KEY=cambia_esta_llave_para_n8n
    networks:
      - kafka-net
      - app-net
    depends_on:
      - kafka

  frontend-react:
    build:
      context: ./frontend_new
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
        - NEXT_PUBLIC_BASE_URL=http://localhost:3000
        - NEXT_PUBLIC_WOMPI_PUBLIC_KEY=${WOMPI_PUBLIC_KEY}
    container_name: frontend-react
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=cloudfly-local-secret-change-later
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_BASE_URL=http://localhost:3000
      - NEXT_PUBLIC_FRONTEND_URL=http://localhost:3000
      - ENVIRONMENT=development
      - NODE_ENV=development
    networks:
      - app-net

  redis:
    image: redis:latest
    container_name: redis_server
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-net
    command: redis-server --requirepass Elian2020#

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    environment:
      TZ: America/Bogota
    networks:
      - app-net

  postgresql:
    image: pgvector/pgvector:pg15
    container_name: postgres_server
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chatbotdb
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net

  # ====================
  # EVOLUTION API (WhatsApp)
  # ====================

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8082:8080"
    environment:
      - CACHE_REDIS_URI=redis://:Elian2020%23@redis:6379/2
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - app-net

  chat-socket-service:
    build:
      context: ./chat-socket-service
      dockerfile: Dockerfile
    container_name: chat_socket
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3001"
    environment:
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - kafka
      - redis
      - db
    networks:
      - app-net
      - kafka-net

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: ai_agent
    restart: always
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DB_HOST=${MYSQL_HOST:-mysql}
      - DB_USER=${MYSQL_USER:-root}
      - DB_PASSWORD=${MYSQL_PASSWORD:-widowmaker}
      - DB_NAME=${MYSQL_DATABASE:-cloud_master}
      - JAVA_API_URL=http://backend-api:8080
    networks:
      - app-net
      - kafka-net
    depends_on:
      - kafka
      - redis
      - db
    volumes:
      - ./uploads:/app/uploads

  ai-vector-worker:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: ai_vector_worker
    restart: always
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DB_HOST=${MYSQL_HOST:-mysql}
      - DB_USER=${MYSQL_USER:-root}
      - DB_PASSWORD=${MYSQL_PASSWORD:-widowmaker}
      - DB_NAME=${MYSQL_DATABASE:-cloud_master}
    networks:
      - app-net
      - kafka-net
    depends_on:
      - kafka
      - db
    command: ["python", "vector_worker.py"]

  lead-generator:
    build:
      context: ./lead-generator
      dockerfile: Dockerfile
    container_name: lead-generator
    restart: always
    ports:
      - "8001:8000"
    networks:
      - app-net
    environment:
      - APIFY_TOKEN=${APIFY_TOKEN}
      - APIFY_BASE_URL=https://api.apify.com/v2

  # Kafka consumer workers — escalar: docker compose up -d --scale lead-scrapper-google=3
  lead-scrapper-google:
    build:
      context: ./lead-scrapper-google
      dockerfile: Dockerfile
    restart: always
    command: ["python3", "worker.py"]
    networks:
      - app-net
      - kafka-net
    depends_on:
      - kafka
      - db
    security_opt:
      - seccomp:unconfined
    shm_size: '2gb'
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_HOST=kafka:9092
      - DB_HOST=mysql
      - DB_DATABASE=cloud_master
      - DB_USERNAME=root
      - DB_PASSWORD=widowmaker
      - LOG_LEVEL=INFO

  marketing-agent:
    build:
      context: .
      dockerfile: marketing_team_ai/Dockerfile
    container_name: marketing-agent
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-cloud_master}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-widowmaker}
      - KAFKA_HOST=${KAFKA_HOST:-kafka}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_HOST:-kafka}:9092
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY}
      - BACKEND_API_KEY=${AUTHENTICATION_API_KEY}
      - LEAD_GENERATOR_URL=http://lead-generator:8000
    networks:
      - app-net
      - kafka-net
    depends_on:
      - kafka
      - db

  # ====================
  # N8N (Automatización)
  # ====================

  n8n:
    image: n8nio/n8n:latest
    container_name: n8nserver.com
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - NODE_ENV=development
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app-net

  marketing-worker:
    image: cloudfly-marketing-worker:latest
    container_name: marketing-worker
    restart: always
    build:
      context: ./marketing-worker
      dockerfile: Dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=cloud_master
      - DB_USERNAME=root
      - DB_PASSWORD=widowmaker
      - KAFKA_HOST=kafka
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=CAMBIA_ESTA_LLAVE_LARGA_Y_UNICA
    networks:
      - app-net
      - kafka-net
    depends_on:
      - kafka
      - db

volumes:
  persistent_master:
  postgres_data:
  portainer_data:
  evolution_instances:
  n8n_data:
  qdrant_storage:

networks:
  app-net:
    driver: bridge
  kafka-net:
    driver: bridge
  default:
    driver: bridge

