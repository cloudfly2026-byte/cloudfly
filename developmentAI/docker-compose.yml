version: '3.8'

services:
  # ── MySQL Database ───────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      TZ: America/Bogota
      MYSQL_DATABASE: cloud_master
      MYSQL_PASSWORD: widowmaker
      MYSQL_ROOT_PASSWORD: widowmaker
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-net
      - kafka-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Zookeeper (Kafka dependency) ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Apache Kafka ─────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: always
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:9092,PLAINTEXT_EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_server
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass Elian2020#
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Elian2020#", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API (Spring Boot) ────────────────────────────────────────────
  backend-api:
    build:
      context: ../backend_new
      dockerfile: Dockerfile
    container_name: backend-api
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - uploads:/uploads
    environment:
      TZ: America/Bogota
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: cloud_master
      SPRING_R2DBC_URL: r2dbc:mysql://mysql:3306/cloud_master?serverZoneId=America/Bogota
      DB_USERNAME: root
      DB_PASSWORD: widowmaker
      KAFKA_HOST: kafka
      SPRING_PROFILES_ACTIVE: development
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: CAMBIA_ESTA_LLAVE_LARGA_Y_UNICA
      JWT_SECRET: dev-jwt-secret-change-in-production
      N8N_SECRET_KEY: dev-n8n-secret-key
    networks:
      - app-net
      - kafka-net
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Frontend React (Next.js) ─────────────────────────────────────────────
  frontend-react:
    build:
      context: ../frontend_new
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
        - NEXT_PUBLIC_BASE_URL=http://localhost:3000
    container_name: frontend-react
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-nextauth-secret
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: development
      NODE_ENV: production
    networks:
      - app-net
    depends_on:
      backend-api:
        condition: service_healthy

  # ── Chat Socket Service (Socket.IO) ──────────────────────────────────────
  chat-socket-service:
    build:
      context: ../chat-socket-service
      dockerfile: Dockerfile
    container_name: chat_socket
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      JAVA_API_URL: http://localhost:8080
      JWT_SECRET: dev-jwt-secret
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cloud_master
      DB_USER: root
      DB_PASSWORD: widowmaker
      REDIS_HOST: redis_server
      REDIS_PORT: 6379
      REDIS_PASSWORD: Elian2020#
      KAFKA_BROKER: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - app-net
      - kafka-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Notification Service (Java/Kafka) ────────────────────────────────────
  notification-service:
    build:
      context: ../notifications
      dockerfile: Dockerfile
    container_name: notification-service
    restart: always
    ports:
      - "8081:8080"
    environment:
      TZ: America/Bogota
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: cloud_master
      DB_USERNAME: root
      DB_PASSWORD: widowmaker
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: CAMBIA_ESTA_LLAVE_LARGA_Y_UNICA
      SOCKET_SERVICE_URL: http://chat_socket:3001
    networks:
      - kafka-net
      - app-net
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy

  # ── Evolution API (WhatsApp) ─────────────────────────────────────────────
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8082:8080"
    environment:
      CACHE_REDIS_URI: redis://:Elian2020%23@redis_server:6379/2
      SERVER_URL: http://localhost:8082
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://chatbot_user:chatbot_pass@postgres_server:5432/chatbotdb
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ── PostgreSQL (for Evolution API) ───────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres_server
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chatbotdb
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbotdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Marketing Agent ──────────────────────────────────────────────────────
  marketing-agent:
    build:
      context: ../marketing_team_ai
      dockerfile: Dockerfile
    container_name: marketing-agent
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: cloud_master
      DB_USERNAME: root
      DB_PASSWORD: widowmaker
      KAFKA_HOST: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVOLUTION_API_URL: http://evolution_api:8080
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    networks:
      - app-net
      - kafka-net
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy

  # ── Kafdrop (Kafka UI) ──────────────────────────────────────────────────
  kafdrop:
    image: obsidiandynamics/kafdrop:3.30.0
    container_name: kafdrop
    restart: always
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms32M -Xmx64M"
      SERVER_SERVLET_CONTEXTPATH: "/"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-net

volumes:
  mysql_data:
  postgres_data:
  evolution_data:
  uploads:

networks:
  app-net:
    driver: bridge
  kafka-net:
    driver: bridge
