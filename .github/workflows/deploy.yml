name: CI/CD Production Deploy

on:
  push:
    branches:
      - main

jobs:
  detect-changes:
    name: Detect Service Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend-api: ${{ steps.filter.outputs.backend-api }}
      billing-service: ${{ steps.filter.outputs.billing-service }}
      scheduler-service: ${{ steps.filter.outputs.scheduler-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      frontend-react: ${{ steps.filter.outputs.frontend-react }}
      chat-socket-service: ${{ steps.filter.outputs.chat-socket-service }}
      ai-agent: ${{ steps.filter.outputs.ai-agent }}
      lead-generator: ${{ steps.filter.outputs.lead-generator }}
      lead-scrapper-google: ${{ steps.filter.outputs.lead-scrapper-google }}
      marketing-agent: ${{ steps.filter.outputs.marketing-agent }}
      marketing-worker: ${{ steps.filter.outputs.marketing-worker }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check path filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend-api:
              - 'backend_new/**'
              - '.github/workflows/deploy.yml'
            billing-service:
              - 'billing-service/**'
              - '.github/workflows/deploy.yml'
            scheduler-service:
              - 'scheduler_service/**'
              - '.github/workflows/deploy.yml'
            notification-service:
              - 'notifications/**'
              - '.github/workflows/deploy.yml'
            frontend-react:
              - 'frontend_new/**'
              - '.github/workflows/deploy.yml'
            chat-socket-service:
              - 'chat-socket-service/**'
              - '.github/workflows/deploy.yml'
            ai-agent:
              - 'ai-agent/**'
              - '.github/workflows/deploy.yml'
            lead-generator:
              - 'lead-generator/**'
              - '.github/workflows/deploy.yml'
            lead-scrapper-google:
              - 'lead-scrapper-google/**'
              - 'lead_scrapper_google/**'
              - '.github/workflows/deploy.yml'
            marketing-agent:
              - 'marketing_team_ai/**'
              - '.github/workflows/deploy.yml'
            marketing-worker:
              - 'marketing-worker/**'
              - '.github/workflows/deploy.yml'

  build-and-push:
    name: Build & Push Microservices
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend-api
            context: ./backend_new
            file: ./backend_new/Dockerfile
            key: backend-api
          - name: billing-service
            context: ./billing-service
            file: ./billing-service/Dockerfile
            key: billing-service
          - name: scheduler-service
            context: ./scheduler_service
            file: ./scheduler_service/Dockerfile
            key: scheduler-service
          - name: notification-service
            context: ./notifications
            file: ./notifications/Dockerfile
            key: notification-service
          - name: frontend-react
            context: ./frontend_new
            file: ./frontend_new/Dockerfile
            key: frontend-react
          - name: chat-socket-service
            context: ./chat-socket-service
            file: ./chat-socket-service/Dockerfile
            key: chat-socket-service
          - name: ai-agent
            context: ./ai-agent
            file: ./ai-agent/Dockerfile
            key: ai-agent
          - name: lead-generator
            context: ./lead-generator
            file: ./lead-generator/Dockerfile
            key: lead-generator
          - name: lead-scrapper-google
            context: ./lead-scrapper-google
            file: ./lead-scrapper-google/Dockerfile
            key: lead-scrapper-google
          - name: marketing-agent
            context: ./marketing_team_ai
            file: ./marketing_team_ai/Dockerfile
            key: marketing-agent
          - name: marketing-worker
            context: ./marketing-worker
            file: ./marketing-worker/Dockerfile
            key: marketing-worker
    steps:
      - name: Checkout repository
        if: ${{ needs.detect-changes.outputs[matrix.service.key] == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: ${{ needs.detect-changes.outputs[matrix.service.key] == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ needs.detect-changes.outputs[matrix.service.key] == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository owner
        if: ${{ needs.detect-changes.outputs[matrix.service.key] == 'true' }}
        id: repository_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        if: ${{ needs.detect-changes.outputs[matrix.service.key] == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL || 'https://api.cloudfly.com.co' }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL || vars.NEXT_PUBLIC_BASE_URL || 'https://dashboard.cloudfly.com.co' }}
            NEXT_PUBLIC_WOMPI_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_WOMPI_PUBLIC_KEY || vars.NEXT_PUBLIC_WOMPI_PUBLIC_KEY || 'pub_test_fGQ5uisyUhqe79cakGHXNKbdsr4K4EVI' }}
          tags: |
            ghcr.io/${{ steps.repository_owner.outputs.owner }}/cloudfly/${{ matrix.service.name }}:latest
            ghcr.io/${{ steps.repository_owner.outputs.owner }}/cloudfly/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: VPS Deploy
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '109.205.182.94'
          username: 'root'
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            if [ ! -d "/apps/cloudfly/.git" ]; then
              echo "Repository not found on VPS. Cloning..."
              rm -rf /apps/cloudfly
              mkdir -p /apps
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cloudfly2026-byte/cloudfly.git /apps/cloudfly
            fi
            cd /apps/cloudfly
            git config --global --add safe.directory /apps/cloudfly
            git pull origin main
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose -f docker-compose-full-vps.yml pull
            docker compose -f docker-compose-full-vps.yml up -d
            docker image prune -f
