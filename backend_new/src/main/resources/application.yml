spring:
  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:cloud_master}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  main:
    web-application-type: reactive
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: 8080
  max-http-request-header-size: 65536

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.app: INFO
    org.springframework.data.r2dbc: WARN
    io.asyncer.r2dbc.mysql: WARN
    org.springframework.security: WARN
    org.springframework.web: INFO
    org.springframework.http: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 1 dia en ms

internal:
  ai:
    secret: ${AI_INTERNAL_SECRET:}

evolution:
  api:
    url: ${EVOLUTION_API_URL:http://evolution-api:8080}
    key: ${EVOLUTION_API_KEY}
  webhook:
    url: ${EVOLUTION_WEBHOOK_URL:https://api.cloudfly.com.co/api/webhooks/evolution}

services:
  socket:
    url: ${SOCKET_URL:http://chat-socket-service:3001}
    secret: ${N8N_SECRET_KEY}
  scheduler:
    url: ${SCHEDULER_URL:http://scheduler-service:8080}

facebook:
  app:
    id: ${FACEBOOK_APP_ID:}
    secret: ${FACEBOOK_APP_SECRET:}
    version: v19.0
  login:
    app:
      id: ${FACEBOOK_LOGIN_APP_ID:}
      secret: ${FACEBOOK_LOGIN_APP_SECRET:}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}

lead-generator:
  url: ${LEAD_GENERATOR_URL:http://lead-generator:8000}
