# version produccion: 1.0.0
services:
  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      TZ: America/Bogota
      MYSQL_DATABASE: cloud_master
      MYSQL_PASSWORD: widowmaker
      MYSQL_ROOT_PASSWORD: widowmaker
    volumes:
      - persistent_master:/var/lib/mysql
    networks:
      - default
      - kafka-net
      - app-net



  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    # ports:
    #   - "9092:9092"
    #   - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:9092,PLAINTEXT_EXTERNAL://109.205.182.94:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - kafka-net

  backend-api:
    image: ghcr.io/cloudfly2026-byte/cloudfly/backend-api:latest
    container_name: backend-api
    build:
      context: ./backend_new
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/uploads
    env_file:
      - .env
    environment:
      - TZ=America/Bogota
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=cloud_master
      - SPRING_R2DBC_URL=r2dbc:mysql://mysql:3306/cloud_master?serverZoneId=America/Bogota
      - DB_USERNAME=root
      - DB_PASSWORD=widowmaker
      - KAFKA_HOST=kafka
      - SPRING_PROFILES_ACTIVE=production
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=CAMBIA_ESTA_LLAVE_LARGA_Y_UNICA
      - JWT_SECRET=${JWT_SECRET}
      - LEAD_GENERATOR_URL=http://lead-generator:8000
    networks:
      - app-net
      - kafka-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.cloudfly.com.co`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.docker.network=cloudfly_app-net"


  billing-service:
    image: ghcr.io/cloudfly2026-byte/cloudfly/billing-service:latest
    container_name: billing-service
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8086:8080"
    env_file:
      - .env
    environment:
      - TZ=America/Bogota
      - BACKEND_API_URL=http://backend-api:8080/internal/billing
      - WOMPI_PRIVATE_KEY=${WOMPI_PRIVATE_KEY}
      - WOMPI_PUBLIC_KEY=${WOMPI_PUBLIC_KEY}
      - WOMPI_EVENTS_SECRET=${WOMPI_EVENTS_SECRET}
      - WOMPI_BASE_URL=https://sandbox.wompi.co/v1
      - KAFKA_BROKER=kafka:9092
      - PORT=8080
    volumes:
      - ./uploads:/uploads
    networks:
      - app-net
      - kafka-net
    depends_on:
      - backend-api
      - kafka

  scheduler-service:
    image: ghcr.io/cloudfly2026-byte/cloudfly/scheduler-service:latest
    container_name: scheduler-service
    restart: always
    ports:
      - "8085:8080"
    build:
      context: ./scheduler_service
      dockerfile: Dockerfile
    volumes:
      - ./uploads:/uploads
    env_file:
      - .env
    environment:
      - TZ=America/Bogota
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=cloud_master
      - SPRING_R2DBC_URL=r2dbc:mysql://mysql:3306/cloud_master?serverZoneId=America/Bogota
      - DB_USERNAME=root
      - DB_PASSWORD=widowmaker
      - KAFKA_HOST=kafka
      - SPRING_PROFILES_ACTIVE=production
    networks:
      - app-net
      - kafka-net
    depends_on:
      - db
      - kafka
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scheduler.rule=Host(`calendar.cloudfly.com.co`)"
      - "traefik.http.routers.scheduler.entrypoints=websecure"
      - "traefik.http.routers.scheduler.tls=true"
      - "traefik.http.routers.scheduler.tls.certresolver=le"
      - "traefik.http.services.scheduler.loadbalancer.server.port=8080"
      - "traefik.docker.network=cloudfly_app-net"

  notification-service:
    image: ghcr.io/cloudfly2026-byte/cloudfly/notification-service:latest
    build:
      context: ./notifications
      dockerfile: Dockerfile
    container_name: notification-service
    restart: always
    environment:
      - TZ=America/Bogota
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_PROFILES_ACTIVE=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=cloud_master
      - DB_USERNAME=root
      - DB_PASSWORD=widowmaker
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - SOCKET_SERVICE_URL=http://chat_socket:3001
      - N8N_SECRET_KEY=cambia_esta_llave_para_n8n
    networks:
      - kafka-net
      - app-net
    depends_on:
      - kafka

  frontend-react:
    image: ghcr.io/cloudfly2026-byte/cloudfly/frontend-react:latest
    build:
      context: ./frontend_new
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.cloudfly.com.co
        - NEXT_PUBLIC_BASE_URL=https://dashboard.cloudfly.com.co
        - NEXT_PUBLIC_WOMPI_PUBLIC_KEY=${WOMPI_PUBLIC_KEY}
    container_name: frontend-react
    restart: always
    environment:
      - NEXTAUTH_URL=https://dashboard.cloudfly.com.co
      - NEXTAUTH_SECRET=cloudfly-prod-secret-change-later
      - NEXT_PUBLIC_API_URL=https://api.cloudfly.com.co
      - NEXT_PUBLIC_BASE_URL=https://dashboard.cloudfly.com.co
      - NEXT_PUBLIC_FRONTEND_URL=https://dashboard.cloudfly.com.co
      - ENVIRONMENT=production
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`dashboard.cloudfly.com.co`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.docker.network=cloudfly_app-net"
    networks:
      - app-net
      - developmentai_app-net

  redis:
    image: redis:latest
    container_name: redis_server
    restart: always
    
    networks:
      - app-net
    command: redis-server --requirepass Elian2020#
  
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    environment:
      TZ: America/Bogota
    networks:
      - app-net


  postgresql:
    image: pgvector/pgvector:pg15
    container_name: postgres_server
    restart: always
    environment:
      POSTGRES_DB: chatbotdb
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_pass
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net



  # ====================
  # EVOLUTION API (WhatsApp)
  # ====================

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    extra_hosts:
      - "chat.cloudfly.com.co:172.18.0.1"
      - "api.cloudfly.com.co:172.18.0.1"
    ports:
      - "8082:8080"  # Puerto para acceso local/desarrollo
    environment:
      - CACHE_REDIS_URI=redis://:Elian2020%23@redis:6379/2
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - app-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eapi.rule=Host(`eapi.cloudfly.com.co`)"
      - "traefik.http.routers.eapi.entrypoints=websecure"
      - "traefik.http.routers.eapi.tls=true"
      - "traefik.http.routers.eapi.tls.certresolver=le"
      - "traefik.http.services.eapi.loadbalancer.server.port=8080"
  
  
  chat-socket-service:
    image: ghcr.io/cloudfly2026-byte/cloudfly/chat-socket-service:latest
    build:
      context: ./chat-socket-service
      dockerfile: Dockerfile
    container_name: chat_socket
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3001"
    environment:
      # AI-Ready Infrastructure
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - kafka
      - redis
      - db
    networks:
      - app-net
      - kafka-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chatsocket.rule=Host(`chat.cloudfly.com.co`)"
      - "traefik.http.routers.chatsocket.entrypoints=websecure"
      - "traefik.http.routers.chatsocket.tls=true"
      - "traefik.http.routers.chatsocket.tls.certresolver=le"
      - "traefik.http.services.chatsocket.loadbalancer.server.port=3001"

  ai-agent:
    image: ghcr.io/cloudfly2026-byte/cloudfly/ai-agent:latest
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: ai_agent
    restart: always
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DB_HOST=${MYSQL_HOST:-mysql}
      - DB_USER=${MYSQL_USER:-root}
      - DB_PASSWORD=${MYSQL_PASSWORD:-widowmaker}
      - DB_NAME=${MYSQL_DATABASE:-cloud_master}
      - JAVA_API_URL=http://backend-api:8080
    networks:
      - app-net
      - kafka-net
    depends_on:
      - kafka
      - redis
      - db
    volumes:
      - ./uploads:/app/uploads

  ai-vector-worker:
    image: ghcr.io/cloudfly2026-byte/cloudfly/ai-agent:latest
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: ai_vector_worker
    restart: always
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DB_HOST=${MYSQL_HOST:-mysql}
      - DB_USER=${MYSQL_USER:-root}
      - DB_PASSWORD=${MYSQL_PASSWORD:-widowmaker}
      - DB_NAME=${MYSQL_DATABASE:-cloud_master}
    networks:
      - app-net
      - kafka-net
    depends_on:
      - kafka
      - db
    command: ["python", "vector_worker.py"]

  lead-generator:
    image: ghcr.io/cloudfly2026-byte/cloudfly/lead-generator:latest
    build:
      context: ./lead-generator
      dockerfile: Dockerfile
    container_name: lead-generator
    restart: always
    ports:
      - "8001:8000"
    networks: 
      - app-net
    environment:
      - APIFY_TOKEN=${APIFY_TOKEN}
      - APIFY_BASE_URL=https://api.apify.com/v2

  # Kafka consumer workers — escalar: docker compose up -d --scale lead-scrapper-google=3
  lead-scrapper-google:
    image: ghcr.io/cloudfly2026-byte/cloudfly/lead-scrapper-google:latest
    build:
      context: ./lead-scrapper-google
      dockerfile: Dockerfile
    restart: always
    command: ["python3", "worker.py"]
    networks:
      - app-net
      - kafka-net
    depends_on:
      - kafka
      - db
    security_opt:
      - seccomp:unconfined
    shm_size: '2gb'
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_HOST=kafka:9092
      - DB_HOST=mysql
      - DB_DATABASE=cloud_master
      - DB_USERNAME=root
      - DB_PASSWORD=widowmaker
      - LOG_LEVEL=INFO

  marketing-agent:
    image: ghcr.io/cloudfly2026-byte/cloudfly/marketing-agent:latest
    build:
      context: ./marketing_team_ai
      dockerfile: Dockerfile

    container_name: marketing-agent
    restart: always
    
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-cloud_master}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-widowmaker}
      - KAFKA_HOST=${KAFKA_HOST:-kafka}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_HOST:-kafka}:9092
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_KEYS_POOL=${OPENROUTER_KEYS_POOL}
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY}
      - BACKEND_API_KEY=${AUTHENTICATION_API_KEY}
      - LEAD_GENERATOR_URL=http://lead-generator:8000
    networks:
      - app-net
      - kafka-net
    depends_on:
      - kafka
      - db


  # ====================
  # N8N (Automatización)
  # ====================

  n8n:
    image: n8nio/n8n:latest
    container_name: n8nserver.com
    restart: always
    environment:
      - N8N_HOST=autobot.cloudfly.com.co
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOT_URL=https://autobot.cloudfly.com.co/
      - N8N_EDITOR_BASE_URL=https://autobot.cloudfly.com.co
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=true
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`autobot.cloudfly.com.co`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=le"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app-net

  marketing-worker:
    image: ghcr.io/cloudfly2026-byte/cloudfly/marketing-worker:latest
    container_name: marketing-worker
    restart: always
    build:
      context: ./marketing-worker
      dockerfile: Dockerfile
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=cloud_master
      - DB_USERNAME=root
      - DB_PASSWORD=widowmaker
      - KAFKA_HOST=kafka
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=CAMBIA_ESTA_LLAVE_LARGA_Y_UNICA
    networks:
      - app-net
      - kafka-net
    depends_on:
      - kafka
      - db

  storefront:
    image: ghcr.io/cloudfly2026-byte/cloudfly/storefront:latest
    container_name: storefront
    build:
      context: ./cloudfly-storefront
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8087:8080"
    volumes:
      - ./uploads:/uploads
      - ./webTemplates:/webTemplates
    environment:
      - BACKEND_API_URL=https://api.cloudfly.com.co
    networks:
      - app-net
    labels:
      - "traefik.enable=true"
      # ----------------------------------------------------------------
      # Wildcard catch-all: cualquier *.cloudfly.com.co que NO tenga
      # un router mas especifico llega aqui (cloudflyshop incluido).
      # Todos los subdominios de servicios propios tienen prioridad
      # por defecto > 1, por lo que siempre ganan sobre este wildcard.
      # Subdominios reservados (no deben llegar al storefront):
      #   api | calendar | dashboard | eapi | chat | autobot
      # ----------------------------------------------------------------
      - "traefik.http.routers.storefront.rule=HostRegexp(`^[a-z0-9-]+\\.cloudfly\\.com\\.co$`)"
      - "traefik.http.routers.storefront.priority=1"
      - "traefik.http.routers.storefront.entrypoints=websecure"
      - "traefik.http.routers.storefront.tls=true"
      - "traefik.http.routers.storefront.tls.certresolver=le"
      - "traefik.http.services.storefront.loadbalancer.server.port=8080"
      - "traefik.docker.network=cloudfly_app-net"

  traefik:
    image: traefik:v3.6.7
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${TRAEFIK_CERTS_DIR:-/apps/cloudfly/certs}:/letsencrypt
    networks:
      - app-net

volumes:
  persistent_master:
  traefik_certs:
  postgres_data:
  portainer_data:
  evolution_instances:
  n8n_data:
  qdrant_storage:

networks:
  app-net:
    driver: bridge
  kafka-net:
    driver: bridge
  default:
    driver: bridge
  # ============================================================
  # CLOUD-248 FIX: External network for chat_socket connectivity
  # The chat_socket container was created under a different compose
  # project (developmentai) and lives on this network.
  # frontend-react must be on this network to resolve chat_socket.
  # ============================================================
  developmentai_app-net:
    external: true
